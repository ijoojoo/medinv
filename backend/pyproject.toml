[project]
name = "medinv"
version = "0.33.1"
description = "Multi-tenant medicine and medical device inventory core"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "alembic>=1.14,<2",
  "authlib>=1.8,<2",
  "requests>=2.32,<3",
  "cryptography>=46,<50",
  "joserfc>=1,<3",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "jsonschema>=4.23,<5",
    "types-jsonschema",
    "types-requests>=2.33.0.20261006",
    "types-authlib>=1.8.0.20260911",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/medinv"]
[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real PostgreSQL 18 runtime-role tests"]
