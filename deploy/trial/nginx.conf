worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_max_body_size 6m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Only the raw path is inspected: encoded OIDC query parameters remain valid.
    map $request_uri $invalid_path {
        default 0;
        ~^[^?]*[%\\\\] 1;
        ~^[^?]*/\.\.?(?:/|\?|$) 1;
    }
    server {
        listen 5173;
        server_name 127.0.0.1;
        root /usr/share/nginx/html;
        if ($invalid_path) { return 404; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = /health/web { default_type application/json; return 200 '{"status":"ok"}'; }
        location = /health/core { proxy_pass http://127.0.0.1:8000/health/ready; }
        location = /health/auth { proxy_pass http://127.0.0.1:8001/health/ready; }
        location /api/ { proxy_pass http://127.0.0.1:8000; }
        location /auth/ { proxy_pass http://127.0.0.1:8001; }
        location /control/ { proxy_pass http://127.0.0.1:8001; }
        location ~ ^/identity/(realms/medinv/|resources/) { proxy_pass http://keycloak:8080; }
        location = /identity { return 404; }
        location /identity/ { return 404; }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location = /index.html {
            add_header Cache-Control "no-store";
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
